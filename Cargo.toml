[package]
name = "ratchet"
version = "0.1.0"
edition = "2021"
description = "Language-agnostic code-quality ratchet: snapshot structural metrics and block regressions in CI."
publish = false

[[bin]]
name = "ratchet"
path = "src/main.rs"

[dependencies]
anyhow             = "1"
clap               = { version = "4", features = ["derive"] }
globset            = "0.4"
serde              = { version = "1", features = ["derive"] }
serde_json         = { version = "1", features = ["preserve_order"] }
tree-sitter        = "0.25"
tree-sitter-language = "0.1"
# Grammars are ordinary registry dependencies, pinned to the exact versions
# rust-code-analysis uses so the parse trees (and therefore the metrics) match
# it. Only Mozilla's unpublished forks are vendored (see `vendor/`).
tree-sitter-rust       = "=0.23.2"
tree-sitter-cpp        = "=0.23.4"
tree-sitter-java       = "=0.23.5"
tree-sitter-python     = "=0.23.6"
tree-sitter-typescript = "=0.23.2"
walkdir            = "2"

[build-dependencies]
cc                 = "1"

[dev-dependencies]
tempfile           = "3"
