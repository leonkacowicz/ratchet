[package]
name = "ratchet"
version = "0.0.1"
edition = "2021"
description = "Language-agnostic code-quality ratchet: snapshot structural metrics and block regressions in CI."
publish = false

[[bin]]
name = "ratchet"
path = "src/main.rs"

[dependencies]
anyhow             = "1"
clap               = { version = "4", features = ["derive"] }
globset            = "0.4"
# crates.io rust-code-analysis 0.0.25 is broken: tree-sitter-rust=0.20.3 pulls a
# newer tree-sitter (0.26) than rust-code-analysis itself can compile against.
# master has the version pins fixed; pinned to a known-good commit for build
# stability.
rust-code-analysis = { git = "https://github.com/mozilla/rust-code-analysis", rev = "37e5d83c056c8cbf827223d5814a93c5218df1a9" }
serde              = { version = "1", features = ["derive"] }
serde_json         = { version = "1", features = ["preserve_order"] }
tree-sitter        = "0.25"
tree-sitter-language = "0.1"
# Grammars are ordinary registry dependencies, pinned to the exact versions
# rust-code-analysis uses so the parse trees (and therefore the metrics) match
# it. Only Mozilla's unpublished forks are vendored (see `vendor/`).
tree-sitter-rust       = "=0.23.2"
tree-sitter-cpp        = "=0.23.4"
tree-sitter-java       = "=0.23.5"
tree-sitter-python     = "=0.23.6"
tree-sitter-typescript = "=0.23.2"
walkdir            = "2"

[build-dependencies]
cc                 = "1"

[dev-dependencies]
tempfile           = "3"
