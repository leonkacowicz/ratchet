name: "Install ratchet"
description: "Install the ratchet code-quality gate (checksum-verified prebuilt binary) and put it on PATH."
branding:
  icon: "check-circle"
  color: "green"

inputs:
  version:
    description: >-
      Release tag to install (e.g. "v0.1.0"), or "latest" to float. Leave unset to install
      the release matching the tag this action is referenced by (`uses: ...@v0.1.0` installs
      ratchet v0.1.0), falling back to "latest" when that ref is not a release tag.
    required: false
    default: ""

outputs:
  version:
    description: "The ratchet version that was installed."
    value: ${{ steps.unix.outputs.version || steps.windows.outputs.version }}

runs:
  using: "composite"
  steps:
    # Linux & macOS: reuse the repo's install.sh (platform detect, checksum-verified
    # download), then expose the install dir to later steps. Fall back to building from
    # source if there's no matching prebuilt asset (e.g. linux-aarch64) or the download
    # fails.
    - name: Install ratchet (Linux/macOS)
      id: unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        RATCHET_VERSION: ${{ inputs.version }}
      run: |
        set -eu
        # Which ratchet to install. An explicit `version:` input always wins. Otherwise
        # derive it from the ref this action was referenced by, so `uses: ...@v0.2.0`
        # installs ratchet 0.2.0 and the tag in the consumer's workflow is the single,
        # truthful version. A ref that names no release — a branch, a SHA, `uses: ./` —
        # has nothing to derive from, so the tool floats to the latest release.
        ver="${RATCHET_VERSION:-}"
        ref="${GITHUB_ACTION_REF:-}"
        case "$ref" in
        v[0-9]*.[0-9]*.[0-9]*) ref_tag="$ref" ;;
        *) ref_tag="" ;;
        esac
        explicit=1
        if [ -z "$ver" ]; then
          explicit=0
          ver="${ref_tag:-latest}"
        fi
        # GITHUB_ACTION_REPOSITORY is unset when the action runs as `uses: ./`
        # (local checkout); fall back to the canonical repo, as install.sh does.
        repo="${GITHUB_ACTION_REPOSITORY:-leonkacowicz/ratchet}"
        dir="$RUNNER_TEMP/ratchet-bin"
        mkdir -p "$dir"
        if bash "$GITHUB_ACTION_PATH/install.sh" --version "$ver" --bin-dir "$dir"; then
          bin="$dir/ratchet"
        else
          echo "::warning::no prebuilt ratchet for this platform; building from source with cargo"
          # No bash arrays: macOS runners ship bash 3.2, where `"${arr[@]}"` on an
          # empty array errors under `set -u`.
          if [ "$ver" = latest ]; then
            cargo install --git "https://github.com/$repo" --locked --root "$dir/cargo"
          else
            cargo install --git "https://github.com/$repo" --locked --tag "$ver" --root "$dir/cargo"
          fi
          bin="$dir/cargo/bin/ratchet"
          echo "$dir/cargo/bin" >>"$GITHUB_PATH"
        fi
        echo "$dir" >>"$GITHUB_PATH"
        installed="$("$bin" --version | awk '{print $2}')"
        # Two things leave the version in the workflow and the tool that ran out of step,
        # and both are legitimate choices rather than errors — so say so in the log and
        # name what was resolved, instead of failing. Silence is what made the default
        # `latest` a trap in the first place.
        if [ "$ver" = latest ]; then
          if [ "$explicit" -eq 1 ]; then
            why="requested explicitly via the 'version' input"
            if [ -n "$ref_tag" ]; then
              why="$why, overriding the release named by the action ref '$ref_tag'"
            fi
          else
            why="the action ref '${ref:-none}' names no release tag"
          fi
          echo "::notice::ratchet version is floating ($why); installed the latest release, $installed. Reference this action by a release tag, or set the 'version' input, to pin it."
        elif [ "$explicit" -eq 1 ] && [ -n "$ref_tag" ] && [ "$ver" != "$ref_tag" ]; then
          echo "::notice::ratchet $installed came from the 'version' input while this action is referenced at '$ref_tag' — the tag in the workflow and the tool it installs are different versions. Drop the 'version' input to install the one the tag names."
        fi
        echo "version=$installed" >>"$GITHUB_OUTPUT"

    # Windows: install.sh is POSIX-only and the asset is a .zip, so do it natively.
    - name: Install ratchet (Windows)
      id: windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        RATCHET_VERSION: ${{ inputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        # Unset under `uses: ./`; fall back to the canonical repo like install.sh.
        $repo = if ($env:GITHUB_ACTION_REPOSITORY) { $env:GITHUB_ACTION_REPOSITORY } else { 'leonkacowicz/ratchet' }
        # Same resolution as the Linux/macOS step: explicit input, else the action's own
        # release tag, else float to latest. Keep the two in step.
        $ver = $env:RATCHET_VERSION
        $ref = $env:GITHUB_ACTION_REF
        $refTag = if ($ref -match '^v\d+\.\d+\.\d+') { $ref } else { '' }
        $explicit = [bool]$ver
        if (-not $explicit) {
          $ver = if ($refTag) { $refTag } else { 'latest' }
        }
        $floating = ($ver -eq 'latest')
        $asked = $ver
        $dir = Join-Path $env:RUNNER_TEMP 'ratchet-bin'
        New-Item -ItemType Directory -Force -Path $dir | Out-Null

        if ($floating) {
          # Resolve via the github.com redirect, not api.github.com — the latter has a
          # tight unauthenticated rate limit that 403s on shared CI runner IPs. Follow
          # the redirect (HEAD, no body) and take the tag from the final URL
          # (…/releases/tag/<tag>).
          $final = (Invoke-WebRequest "https://github.com/$repo/releases/latest" -Method Head).BaseResponse.RequestMessage.RequestUri
          $ver = $final.Segments[-1]
        }

        if ($env:RUNNER_ARCH -eq 'X64') {
          $asset = "ratchet-$ver-x86_64-pc-windows-msvc.zip"
          $base = "https://github.com/$repo/releases/download/$ver"
          Invoke-WebRequest "$base/$asset" -OutFile "$dir\$asset"
          Invoke-WebRequest "$base/$asset.sha256" -OutFile "$dir\$asset.sha256"
          $expected = ((Get-Content "$dir\$asset.sha256") -split '\s+')[0].ToLower()
          $actual = (Get-FileHash "$dir\$asset" -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "checksum verification FAILED for $asset" }
          Expand-Archive "$dir\$asset" -DestinationPath $dir -Force
          $bin = "$dir\ratchet.exe"
        } else {
          Write-Host "::warning::no prebuilt ratchet for Windows/$($env:RUNNER_ARCH); building from source with cargo"
          # $ver is a concrete tag here even when floating — it was resolved above.
          $tag = if ($ver -eq 'latest') { @() } else { @('--tag', $ver) }
          cargo install --git "https://github.com/$repo" --locked @tag --root "$dir\cargo"
          $bin = "$dir\cargo\bin\ratchet.exe"
          Add-Content $env:GITHUB_PATH "$dir\cargo\bin"
        }

        Add-Content $env:GITHUB_PATH $dir
        $installed = (& $bin --version).Split(' ')[1]
        # Mirror of the Linux/macOS notices — see there for why these are notices and not
        # failures. Keep the two wordings identical.
        if ($floating) {
          if ($explicit) {
            $why = "requested explicitly via the 'version' input"
            if ($refTag) { $why = "$why, overriding the release named by the action ref '$refTag'" }
          } else {
            $shownRef = if ($ref) { $ref } else { 'none' }
            $why = "the action ref '$shownRef' names no release tag"
          }
          Write-Host "::notice::ratchet version is floating ($why); installed the latest release, $installed. Reference this action by a release tag, or set the 'version' input, to pin it."
        } elseif ($explicit -and $refTag -and ($asked -ne $refTag)) {
          Write-Host "::notice::ratchet $installed came from the 'version' input while this action is referenced at '$refTag' — the tag in the workflow and the tool it installs are different versions. Drop the 'version' input to install the one the tag names."
        }
        Add-Content $env:GITHUB_OUTPUT "version=$installed"
